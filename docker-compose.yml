services:

  # ─── Redis (broker do Celery) ───
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Django (API do webhook) ───
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py shell -c \"from django.contrib.auth import get_user_model; U = get_user_model(); U.objects.filter(username='admin').exists() or U.objects.create_superuser('admin', 'admin@example.com', 'admin123')\" &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # ─── Celery Worker (processa os 4 serviços) ───
  worker:
    build: .
    command: celery -A core worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

  # ─── Emitter (consumer simulado com callback na porta 9000) ───
  emitter:
    build: .
    command: python emitter.py
    volumes:
      - .:/app
    ports:
      - "9000:9000"
    environment:
      - WEBHOOK_BASE_URL=http://web:8000
      - CALLBACK_BASE_URL=http://emitter:9000
    stdin_open: true
    tty: true
    depends_on:
      web:
        condition: service_started
